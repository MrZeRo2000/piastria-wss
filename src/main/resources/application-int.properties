
spring.application.name=piastria-int-wss
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# not recommended because sends to the std output
# spring.jpa.show-sql=true

# show formatted sql
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=${catalina.home}/logs/piastria-int.log
logging.level.com.romanpulov.piastriawss.aspect.ExecutionLoggingAspect=DEBUG
logging.level.org.springframework.web=TRACE

# show sql statements in log
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Optional external file for sensitive Turso credentials.
spring.config.import=optional:file:./turso-int.properties
