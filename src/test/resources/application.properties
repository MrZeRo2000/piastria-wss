server.port=8081
server.servlet.context-parameters.db-url=jdbc:sqlite:db/database/piastria-test.db
server.servlet.context-parameters.db-backup-path=db/database/backup

spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=logs/piastria.log
logging.level.com.romanpulov.piastriawss.aspect.ExecutionLoggingAspect=DEBUG
logging.level.org.springframework.web=TRACE

#show sql values
logging.level.org.hibernate.type.descriptor.sql=trace

# Optional external file for sensitive Turso credentials in tests.
spring.config.import=optional:file:./turso-test.properties
